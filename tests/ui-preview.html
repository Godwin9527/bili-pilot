<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bili Pilot UI Preview</title>
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      background:
        linear-gradient(rgba(14, 17, 23, .18), rgba(14, 17, 23, .48)),
        radial-gradient(circle at 28% 18%, #fb7299 0, transparent 28%),
        linear-gradient(135deg, #252a35, #111318 68%);
      font-family: system-ui, sans-serif;
    }
    .mock-video { position: fixed; inset: 6vh 7vw; border-radius: 24px; background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.02)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .mock-video::after { content: "BILIBILI / 4K HDR"; position: absolute; left: 28px; bottom: 24px; color: rgba(255,255,255,.52); font: 600 12px/1 system-ui; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div class="mock-video"></div>
  <script>
    const previewLocale = new URLSearchParams(location.search).get("locale") || "en";
    const localeRequest = new XMLHttpRequest();
    localeRequest.open("GET", `../_locales/${previewLocale}/messages.json`, false);
    localeRequest.send();
    const previewMessages = JSON.parse(localeRequest.responseText);
    window.chrome = {
      i18n: {
        getMessage(key, substitutions = []) {
          const values = Array.isArray(substitutions) ? substitutions : [substitutions];
          const entry = previewMessages[key];
          const positional = String(entry?.message || "").replace(
            /\$([A-Za-z][A-Za-z0-9_]*)\$/g,
            (match, name) => entry?.placeholders?.[name.toLowerCase()]?.content || match
          );
          return positional.replace(/\$(\d+)/g, (_match, index) => String(values[Number(index) - 1] ?? ""));
        },
        getUILanguage: () => previewLocale.replace("_", "-")
      },
      storage: { local: { get: async () => ({ prefetchEnabledV1: true }), set: async () => {} } },
      runtime: {
        getManifest: () => ({ version: "0.1.0" }),
        sendMessage: async () => ({
          results: [
            {
              host: "upos-hz-mirrorakam.akamaized.net",
              label: "Akamai",
              minMbps: 51.6,
              failures: 0,
              score: 71,
              samples: [
                { position: 0, ok: true, mbps: 87.1, ttfbMs: 91 },
                { position: .25, ok: true, mbps: 98.3, ttfbMs: 86 },
                { position: .5, ok: true, mbps: 113.8, ttfbMs: 78 },
                { position: .75, ok: true, mbps: 51.6, ttfbMs: 104 }
              ]
            },
            {
              host: "upos-sz-mirrorcosov.bilivideo.com",
              label: "COSOV",
              minMbps: 1.3,
              failures: 2,
              score: -151,
              samples: [
                { position: 0, ok: true, mbps: 160.9, ttfbMs: 80 },
                { position: .25, ok: true, mbps: 1.3, ttfbMs: 620 },
                { position: .5, ok: false, error: "timeout" },
                { position: .75, ok: false, error: "timeout" }
              ]
            }
          ]
        })
      }
    };
    window.addEventListener("message", async (event) => {
      if (event.source !== window || event.origin !== location.origin) return;
      if (event.data?.channel !== "BILI_CDN_PILOT_V1" || event.data?.type !== "BCO_PROBE_REQUEST") return;
      const result = await chrome.runtime.sendMessage();
      window.postMessage({
        channel: "BILI_CDN_PILOT_V1",
        type: "BCO_PROBE_RESULT",
        requestId: event.data.requestId,
        result
      }, location.origin);
    });
  </script>
  <script src="../protocol.js"></script>
  <script src="../i18n.js"></script>
  <script src="../ui-model.js"></script>
  <script src="../content.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => window.postMessage({
        channel: "BILI_CDN_PILOT_V1",
        type: "BCO_CANDIDATES",
        plan: {
          bandwidth: 10354649,
          candidates: [
            { host: "upos-sz-mirrorcosov.bilivideo.com", label: "COSOV", isPrimary: true, url: "https://upos-sz-mirrorcosov.bilivideo.com/video.m4s" },
            { host: "upos-hz-mirrorakam.akamaized.net", label: "Akamai", isPrimary: false, url: "https://upos-hz-mirrorakam.akamaized.net/video.m4s" }
          ],
          codec: "avc1.640033",
          currentPrimary: "upos-sz-mirrorcosov.bilivideo.com",
          height: 2160,
          preferredHost: null,
          prefetchEnabled: true,
          quality: 120,
          qualityLabel: "4K",
          signature: "preview|120|avc1|cosov|akamai",
          videoKey: "BV1Preview",
          width: 3840
        }
      }, location.origin), 120);
      setTimeout(() => window.postMessage({
        channel: "BILI_CDN_PILOT_V1",
        type: "BCO_PREFETCH_STATE",
        enabled: true,
        bytes: 5242880,
        loading: 1,
        queued: 2,
        ready: 4,
        hosts: {
          "upos-hz-mirrorakam.akamaized.net": 2,
          "upos-sz-mirrorcosov.bilivideo.com": 5
        },
        segments: [
          { range: "0-1", host: "upos-hz-mirrorakam.akamaized.net", state: "ready" },
          { range: "1-2", host: "upos-sz-mirrorcosov.bilivideo.com", state: "ready" },
          { range: "2-3", host: "upos-sz-mirrorcosov.bilivideo.com", state: "ready" },
          { range: "3-4", host: "upos-sz-mirrorcosov.bilivideo.com", state: "ready" },
          { range: "4-5", host: "upos-sz-mirrorcosov.bilivideo.com", state: "loading" },
          { range: "5-6", host: "upos-sz-mirrorcosov.bilivideo.com", state: "queued" },
          { range: "6-7", host: "upos-hz-mirrorakam.akamaized.net", state: "queued" }
        ],
        lastHit: { bytes: 838860 }
      }, location.origin), 180);
      setTimeout(() => window.postMessage({
        channel: "BILI_CDN_PILOT_V1",
        type: "BCO_ACTIVITY",
        entries: [
          { id: 1, at: Date.now() - 2400, type: "probe-candidate-start", detail: { host: "upos-hz-mirrorakam.akamaized.net", mode: "quick", positions: [0, 0.5] } },
          { id: 2, at: Date.now() - 1700, type: "probe-candidate-result", detail: { host: "upos-hz-mirrorakam.akamaized.net", failures: 0, minMbps: 51.6 } },
          { id: 3, at: Date.now() - 900, type: "segment-prefetch-start", detail: { host: "upos-sz-mirrorcosov.bilivideo.com", index: 4, range: "bytes=124000-932000", attempt: 1, candidateCount: 2 } },
          { id: 4, at: Date.now() - 200, type: "segment-prefetch-ready", detail: { host: "upos-sz-mirrorcosov.bilivideo.com", index: 4, range: "bytes=124000-932000", bytes: 808001, durationMs: 318.4 } }
        ]
      }, location.origin), 220);
    });
  </script>
</body>
</html>
