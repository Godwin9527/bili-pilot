<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bili Pilot Popup Preview</title>
  <link rel="stylesheet" href="../popup.css">
  <style>
    html { background: #2a2b31; }
    body { margin: 0; }
    .preview-stage {
      display: grid;
      place-items: start center;
      padding: 0;
      background: #2a2b31;
    }
  </style>
</head>
<body>
  <div class="preview-stage" id="stage">
    <div class="shell" id="shell"></div>
  </div>
  <script>
    const previewLocale = new URLSearchParams(location.search).get("locale") || "en";
    let previewMessages = {};
    try {
      const localeRequest = new XMLHttpRequest();
      localeRequest.open("GET", `../_locales/${previewLocale}/messages.json`, false);
      localeRequest.send();
      previewMessages = JSON.parse(localeRequest.responseText);
    } catch {
      // file:// previews cannot read sibling files; fall back to the bundled English strings.
      previewMessages = {};
    }
    let popupListener = null;
    function emit(snapshot) {
      if (popupListener) popupListener(snapshot);
      else setTimeout(() => emit(snapshot), 40);
    }
    const mockApi = {
      i18n: {
        getMessage(key, substitutions = []) {
          const values = Array.isArray(substitutions) ? substitutions : [substitutions];
          const entry = previewMessages[key];
          const positional = String(entry?.message || "").replace(
            /\$([A-Za-z][A-Za-z0-9_]*)\$/g,
            (match, name) => entry?.placeholders?.[name.toLowerCase()]?.content || match
          );
          return positional.replace(/\$(\d+)/g, (_match, index) => String(values[Number(index) - 1] ?? ""));
        },
        getUILanguage: () => previewLocale.replace("_", "-")
      },
      tabs: {
        query: async () => [{ id: 1, url: "https://www.bilibili.com/video/BV1Preview" }],
        reload: async () => {},
        connect: () => ({
          name: "bili-pilot-popup",
          postMessage() {},
          onMessage: { addListener(listener) { popupListener = listener; } },
          onDisconnect: { addListener() {} }
        })
      }
    };
    Object.defineProperty(window, "chrome", { configurable: true, value: mockApi, writable: true });
  </script>
  <script src="../i18n.js"></script>
  <script src="../ui-model.js"></script>
  <script src="../popup.js"></script>
  <script>
    const snapshot = {
      type: "snapshot",
      activityVersion: 4,
      contextInvalidated: false,
      locale: previewLocale,
      version: "0.1.3",
      status: "Akamai is the most stable with a 51.6 Mbps floor. Click Use to switch.",
      statusKind: "success",
      scanning: false,
      prefetchEnabled: true,
      plan: {
        bandwidth: 10354649,
        candidates: [
          { host: "upos-sz-mirrorcosov.bilivideo.com", label: "COSOV", isPrimary: true },
          { host: "upos-hz-mirrorakam.akamaized.net", label: "Akamai", isPrimary: false }
        ],
        codec: "avc1.640033",
        currentPrimary: "upos-sz-mirrorcosov.bilivideo.com",
        features: ["4K", "HDR"],
        height: 2160,
        preferredHost: "upos-hz-mirrorakam.akamaized.net",
        quality: 120,
        qualityLabel: "4K",
        signature: "preview|120|avc1|cosov|akamai",
        videoKey: "BV1Preview",
        width: 3840
      },
      results: [
        {
          host: "upos-hz-mirrorakam.akamaized.net",
          label: "Akamai",
          minMbps: 51.6,
          failures: 0,
          score: 71,
          samples: [
            { position: 0, ok: true, mbps: 87.1, ttfbMs: 91 },
            { position: .25, ok: true, mbps: 98.3, ttfbMs: 86 },
            { position: .5, ok: true, mbps: 113.8, ttfbMs: 78 },
            { position: .75, ok: true, mbps: 51.6, ttfbMs: 104 }
          ]
        },
        {
          host: "upos-sz-mirrorcosov.bilivideo.com",
          label: "COSOV",
          minMbps: 1.3,
          failures: 2,
          score: -151,
          samples: [
            { position: 0, ok: true, mbps: 160.9, ttfbMs: 80 },
            { position: .25, ok: true, mbps: 1.3, ttfbMs: 620 },
            { position: .5, ok: false, error: "timeout" },
            { position: .75, ok: false, error: "timeout" }
          ]
        }
      ],
      prefetch: {
        backoff: 0,

        failed: 0,
        foreground: 1,
        hosts: {},
        loading: 1,

        segments: [
          { range: "0-1", host: "upos-hz-mirrorakam.akamaized.net", state: "ready" },

          { range: "2-3", host: "upos-sz-mirrorcosov.bilivideo.com", state: "ready" },
          { range: "3-4", host: "upos-sz-mirrorcosov.bilivideo.com", state: "ready" },

          { range: "5-6", host: "upos-sz-mirrorcosov.bilivideo.com", state: "queued" },
          { range: "6-7", host: "upos-hz-mirrorakam.akamaized.net", state: "queued" }

    window.addEventListener("DOMContentLoaded", () => {

  </script>
</body>
</html>
